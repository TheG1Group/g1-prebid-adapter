name: Publish to npmjs.org

on:
  push:
    tags:
      - "v*"

jobs:
  publish:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 10.33.0
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: pnpm
          registry-url: "https://registry.npmjs.org"
      - run: pnpm install --frozen-lockfile
      - run: pnpm typecheck
      - run: pnpm test
      - run: pnpm build
      - name: Publish
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
        run: pnpm publish --no-git-checks --access public
      - name: Verify jsDelivr mirror
        run: |
          VERSION=$(node -p "require('./package.json').version")
          for i in {1..10}; do
            if curl -sf "https://cdn.jsdelivr.net/npm/@theg1team/prebid-adapter@${VERSION}/dist/index.js" > /dev/null; then
              echo "jsDelivr mirror live at v${VERSION}"
              exit 0
            fi
            sleep 30
          done
          echo "jsDelivr mirror not yet ready (non-fatal — may take >5min)"
